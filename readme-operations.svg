<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="CAMY operations overview"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#101a31"/><stop offset="1" stop-color="#25184b"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1200" height="420" rx="28" fill="url(#bg)"/><text x="55" y="58" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="28" font-weight="800">CAMY OPERATIONS MAP</text><text x="55" y="84" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="13" letter-spacing="2">ENTREPRENEUR + ADMIN + FULFILMENT</text><g font-family="Segoe UI,Arial"><rect x="55" y="120" width="300" height="230" rx="22" fill="#0b1628" stroke="#22d3ee"/><text x="82" y="158" fill="#67e8f9" font-size="18" font-weight="800">ENTREPRENEUR</text><text x="82" y="195" fill="#e2e8f0" font-size="15">Browse products</text><text x="82" y="227" fill="#e2e8f0" font-size="15">Set selling price</text><text x="82" y="259" fill="#e2e8f0" font-size="15">Create COD order</text><text x="82" y="291" fill="#e2e8f0" font-size="15">Track earnings</text><text x="82" y="323" fill="#e2e8f0" font-size="15">Request credit stock</text><rect x="450" y="120" width="300" height="230" rx="22" fill="#12162c" stroke="#818cf8"/><text x="477" y="158" fill="#c7d2fe" font-size="18" font-weight="800">CAMY ADMIN</text><text x="477" y="195" fill="#e2e8f0" font-size="15">Manage entrepreneurs</text><text x="477" y="227" fill="#e2e8f0" font-size="15">Review orders</text><text x="477" y="259" fill="#e2e8f0" font-size="15">Manage stock</text><text x="477" y="291" fill="#e2e8f0" font-size="15">Record payouts</text><text x="477" y="323" fill="#e2e8f0" font-size="15">Control credit</text><rect x="845" y="120" width="300" height="230" rx="22" fill="#1a1530" stroke="#a78bfa"/><text x="872" y="158" fill="#ddd6fe" font-size="18" font-weight="800">FULFILMENT</text><text x="872" y="195" fill="#e2e8f0" font-size="15">Reserve stock</text><text x="872" y="227" fill="#e2e8f0" font-size="15">Courier dispatch</text><text x="872" y="259" fill="#e2e8f0" font-size="15">Collect COD</text><text x="872" y="291" fill="#e2e8f0" font-size="15">Calculate margin</text><text x="872" y="323" fill="#e2e8f0" font-size="15">Update credit history</text></g><path d="M355 236H450M750 236H845" stroke="url(#a)" stroke-width="4" stroke-linecap="round"/><circle cx="402" cy="236" r="7" fill="#38bdf8"/><circle cx="797" cy="236" r="7" fill="#8b5cf6"/><text x="600" y="392" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="14">SELL → FULFIL → COLLECT → PAY → GROW CREDIT</text></svg>