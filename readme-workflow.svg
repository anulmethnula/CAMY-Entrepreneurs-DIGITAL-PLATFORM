<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="330" viewBox="0 0 1300 330" role="img" aria-label="CAMY business workflow"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#17122d"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1300" height="330" rx="26" fill="url(#bg)"/><text x="54" y="56" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">CAMY BUSINESS WORKFLOW</text><text x="54" y="83" fill="#8ea0b8" font-family="Consolas,monospace" font-size="12" letter-spacing="2">ENTREPRENEUR → OPERATIONS → COD → PAYOUT → CREDIT</text><g transform="translate(54 124)" font-family="Segoe UI,Arial,sans-serif"><line x1="88" y1="55" x2="1125" y2="55" stroke="#334155" stroke-width="4"/><line x1="88" y1="55" x2="1125" y2="55" stroke="url(#a)" stroke-width="4" stroke-dasharray="12 14"><animate attributeName="stroke-dashoffset" from="0" to="-150" dur="7s" repeatCount="indefinite"/></line><g text-anchor="middle"><g transform="translate(88 55)"><circle r="30" fill="#082a31" stroke="#22d3ee"/><text y="5" fill="#67e8f9" font-size="14" font-weight="800">01</text><text y="62" fill="#cbd5e1" font-size="12" font-weight="700">SELL</text><text y="80" fill="#7f8ea3" font-size="10">Select + price</text></g><g transform="translate(296 55)"><circle r="30" fill="#0e2043" stroke="#3b82f6"/><text y="5" fill="#93c5fd" font-size="14" font-weight="800">02</text><text y="62" fill="#cbd5e1" font-size="12" font-weight="700">ORDER</text><text y="80" fill="#7f8ea3" font-size="10">Create COD</text></g><g transform="translate(504 55)"><circle r="30" fill="#172036" stroke="#60a5fa"/><text y="5" fill="#bfdbfe" font-size="14" font-weight="800">03</text><text y="62" fill="#cbd5e1" font-size="12" font-weight="700">FULFIL</text><text y="80" fill="#7f8ea3" font-size="10">Reserve + dispatch</text></g><g transform="translate(712 55)"><circle r="30" fill="#20153b" stroke="#8b5cf6"/><text y="5" fill="#c4b5fd" font-size="14" font-weight="800">04</text><text y="62" fill="#cbd5e1" font-size="12" font-weight="700">COLLECT</text><text y="80" fill="#7f8ea3" font-size="10">Receive COD</text></g><g transform="translate(920 55)"><circle r="30" fill="#2a1d0a" stroke="#f59e0b"/><text y="5" fill="#fde68a" font-size="14" font-weight="800">05</text><text y="62" fill="#cbd5e1" font-size="12" font-weight="700">PAYOUT</text><text y="80" fill="#7f8ea3" font-size="10">Pay margin</text></g><g transform="translate(1128 55)"><circle r="30" fill="#10261f" stroke="#22c55e"/><text y="5" fill="#86efac" font-size="14" font-weight="800">06</text><text y="62" fill="#cbd5e1" font-size="12" font-weight="700">CREDIT</text><text y="80" fill="#7f8ea3" font-size="10">Build eligibility</text></g></g><rect x="814" y="126" width="365" height="54" rx="14" fill="#0f172a" stroke="#334155"/><text x="996" y="148" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Consolas,monospace" letter-spacing="1">PHASE 2</text><text x="996" y="167" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Eligible entrepreneur → Credit stock → Settlement</text></g></svg>